<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deekshitha Character Animation Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 35%,#182548 0,#090d18 42%,#04060b 100%);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
.stage{width:min(1100px,96vw);height:min(720px,92vh);position:relative;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(95,155,255,.28),rgba(75,92,255,.08) 48%,transparent 70%);filter:blur(18px);animation:pulse 4s ease-in-out infinite}
.character{position:relative;width:min(620px,70vw);height:min(680px,82vh);transform-origin:50% 82%;animation:idle 5.2s ease-in-out infinite;will-change:transform,filter}
.character img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 28px 35px rgba(0,0,0,.48))}
.character.speaking{animation:talkBody 1.05s ease-in-out infinite}
.character.speaking img{filter:drop-shadow(0 28px 35px rgba(0,0,0,.48)) brightness(calc(1 + var(--energy,0)*.06))}
.face-motion{position:absolute;left:50%;top:21%;width:30%;height:24%;transform:translateX(-50%);pointer-events:none}
.character.speaking .face-motion{animation:microNod .72s ease-in-out infinite}
.controls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:5}
button{border:1px solid rgba(255,255,255,.25);background:rgba(13,22,42,.72);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:13px 20px;font-weight:700;cursor:pointer}
button:hover{background:rgba(40,67,120,.8)}.status{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-.35deg) scale(1)}50%{transform:translateY(-8px) rotate(.35deg) scale(1.006)}}
@keyframes talkBody{0%,100%{transform:translateY(0) rotate(-.3deg) scale(1)}25%{transform:translateY(calc(-3px - var(--energy,0)*5px)) rotate(.2deg) scale(calc(1 + var(--energy,0)*.008))}55%{transform:translateY(calc(-7px - var(--energy,0)*3px)) rotate(.45deg) scale(calc(1 + var(--energy,0)*.012))}78%{transform:translateY(-2px) rotate(-.1deg) scale(1.003)}}
@keyframes microNod{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(3px)}}
@keyframes pulse{0%,100%{transform:scale(.96);opacity:.72}50%{transform:scale(1.05);opacity:1}}
.note{position:absolute;right:18px;bottom:18px;max-width:260px;font-size:12px;line-height:1.45;opacity:.5}
@media(max-width:700px){.character{width:92vw;height:78vh}.note{display:none}}
</style></head>
<body>
<main class="stage">
<div class="status" id="status">Animation prototype · isolated branch</div>
<div class="glow" id="glow"></div>
<div class="character" id="character"><img src="deekshitha-hero.jpg" alt="Animated Deekshitha prototype"><div class="face-motion"></div></div>
<div class="controls"><button id="meet">Meet Deekshitha</button><button id="stop">Stop</button></div>
<div class="note">Prototype only. This branch does not change the live homepage. Motion reacts to voice energy; a single flat image cannot provide true independent lip/eye/hand articulation.</div>
<audio id="voice" src="sai-intro.mp3" preload="auto"></audio>
</main>
<script>
const audio=document.getElementById('voice'), character=document.getElementById('character'), glow=document.getElementById('glow'), status=document.getElementById('status');
let ctx, analyser, data, raf;
async function start(){
 if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)(); const src=ctx.createMediaElementSource(audio); analyser=ctx.createAnalyser(); analyser.fftSize=256; data=new Uint8Array(analyser.frequencyBinCount); src.connect(analyser); analyser.connect(ctx.destination)}
 await ctx.resume(); audio.currentTime=0; await audio.play(); character.classList.add('speaking'); status.textContent='Deekshitha is speaking'; react();
}
function react(){analyser.getByteFrequencyData(data); let sum=0; for(const v of data)sum+=v; const e=Math.min(1,(sum/data.length)/95); character.style.setProperty('--energy',e.toFixed(3)); glow.style.transform='scale('+(1+e*.09)+')'; raf=requestAnimationFrame(react)}
function reset(){cancelAnimationFrame(raf);character.classList.remove('speaking');character.style.setProperty('--energy',0);glow.style.transform='';status.textContent='Animation prototype · isolated branch'}
document.getElementById('meet').onclick=start;document.getElementById('stop').onclick=()=>{audio.pause();audio.currentTime=0;reset()};audio.onended=reset;
</script></body></html>
